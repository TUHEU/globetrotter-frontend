<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>globetrotter-frontend</title>
      <!-- PWA: tells the browser this site can be installed like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script>
      // Register the service worker (see public/service-worker.js). It runs
      // in the background and makes the app work offline and installable.
      // We wait for 'load' so it never competes with the first paint.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js").catch(function (error) {
            // Not fatal: the app simply stays online-only.
            console.log("Service worker not registered:", error);
          });
        });
      }
    </script>
  </body>
</html>
